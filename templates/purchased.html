<!DOCTYPE html>
<html>
<head><title>Покупки</title></head>
<body>
  <h1>Купленные цветы</h1>
  {% if flowers %}
    <ul>
      {% for flower in flowers %}
        <li>{{ flower.name }} - {{ flower.price }} руб.</li>
      {% endfor %}
    </ul>
  {% else %}
    <p>Вы ещё ничего не купили.</p>
  {% endif %}
  <p><a href="/flowers">Назад к цветам</a></p>
</body>
</html>
