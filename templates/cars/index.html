<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cars List</title>
</head>
<body>
    <h1>Cars List</h1>

    <ul>
        {% for car in cars %}
            <li>{{ car['name'] }} - {{ car['year'] }}</li>
        {% endfor %}
    </ul>

    <a href="{{ url_for('new_car') }}">Add New Car</a>
    <a href="{{ url_for('search_cars') }}">Search Cars</a>
</body>
</html>
