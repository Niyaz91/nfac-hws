<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Cars</title>
</head>
<body>
    <h1>Search Cars</h1>

    <form method="get" action="{{ url_for('search_cars') }}">
        <label for="car_name">Car Name:</label>
        <input type="text" id="car_name" name="car_name" value="{{ car_name }}">
        <button type="submit">Search</button>
    </form>

    <h2>Results</h2>
    <ul>
        {% for car in cars %}
            <li>{{ car['name'] }} - {{ car['year'] }}</li>
        {% else %}
            <li>No cars found</li>
        {% endfor %}
    </ul>
</body>
</html>
