<!DOCTYPE html>
<html>
<head><title>Корзина</title></head>
<body>
  <h1>Корзина</h1>
  {% if items %}
    <ul>
      {% for item in items %}
        <li>{{ item.name }} - {{ item.price }} руб.</li>
      {% endfor %}
    </ul>
    <p><strong>Общая сумма:</strong> {{ total }} руб.</p>
    <form action="/purchased" method="post">
      <button type="submit">Купить всё</button>
    </form>
  {% else %}
    <p>Корзина пуста</p>
  {% endif %}
  <p><a href="/flowers">Назад к цветам</a></p>
</body>
</html>
