<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>VoxPop</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Оставьте комментарий</h1>
    <form method="POST">
        <textarea name="text" placeholder="Ваш комментарий..." required></textarea><br>
        <label><input type="radio" name="category" value="positive" checked> Позитивный</label>
        <label><input type="radio" name="category" value="negative"> Негативный</label><br>
        <button type="submit">Отправить</button>
    </form>

    <h2>Публичная лента</h2>
    {% for comment in comments %}
        <div class="comment {{ comment.category }}">
            <p>{{ comment.text }}</p>
            <small>Категория: {{ comment.category }}</small>
        </div>
    {% endfor %}

    <div class="pagination">
        {% for p in range(1, total_pages + 1) %}
            {% if p == current_page %}
                <strong>{{ p }}</strong>
            {% else %}
                <a href="?page={{ p }}">{{ p }}</a>
            {% endif %}
        {% endfor %}
    </div>
</body>
</html>
