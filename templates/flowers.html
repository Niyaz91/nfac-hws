<!DOCTYPE html>
<html>
<head><title>Цветы</title></head>
<body>
  <h1>Добавить цветок</h1>
  <form action="/flowers" method="post">
    Название: <input name="name"><br>
    Кол-во: <input name="quantity" type="number"><br>
    Стоимость: <input name="price" type="number" step="0.01"><br>
    <button type="submit">Добавить</button>
  </form>

  <h2>Список цветов</h2>
  <ul>
    {% for flower in flowers %}
      <li>
        {{ flower.name }} ({{ flower.price }} тг.)
        <form action="/cart/items" method="post" style="display:inline;">
          <input type="hidden" name="flower_id" value="{{ flower.id }}">
          <button type="submit">Добавить в корзину</button>
        </form>
      </li>
    {% endfor %}
  </ul>
  <p><a href="/cart/items">Корзина</a></p>
</body>
</html>
