<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books list</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 0 auto;
            padding: 20px;
        }

        .add-button,
        .nav-button {
            display: inline-block;
            padding: 10px 16px;
            margin: 10px 5px 20px 0;
            font-size: 16px;
            background-color: #2196F3;
            color: white;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            transition: background-color 0.2s ease;
        }

        .add-button:hover,
        .nav-button:hover {
            background-color: #0b7dda;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        ul li {
            margin: 8px 0;
        }

        .pagination {
            margin-top: 20px;
        }

        .page-info {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>📚 Books list</h1>

    <!-- Add book button -->
    <a href="/books/new" class="add-button">➕ Add a book</a>

    <ul>
        {% for book in books %}
            <li><a href="/books/{{ book[0] }}">{{ book[1] }}</a></li>
        {% endfor %}
    </ul>

    <div class="pagination">
        {% if page > 1 %}
            <a href="/books?page={{ page - 1 }}" class="nav-button">← Back</a>
        {% endif %}

        {% if page < total_pages %}
            <a href="/books?page={{ page + 1 }}" class="nav-button">Forward →</a>
        {% endif %}
    </div>

    <div class="page-info">
        Page {{ page }} of {{ total_pages }}
    </div>
</body>
</html>
