<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books list</title>
</head>
<body>
    <h1>Books list</h1>
    <ul>
        {% for book in books %}
            <li><a href="/books/{{ book[0] }}">{{ book[1] }}</a></li>
        {% endfor %}
    </ul>

    <div>
        {% if page > 1 %}
            <a href="/books?page={{ page - 1 }}">Back</a>
        {% endif %}

        {% if page < total_pages %}
            <a href="/books?page={{ page + 1 }}">Forward</a>
        {% endif %}
    </div>

    <div>
          <span>Page {{ page }} of {{ total_pages }}</span>
    </div>
</body>
</html>
