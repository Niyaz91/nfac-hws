<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ book[1] }}</title>
    <style>
        .button {
            display: inline-block;
            padding: 10px 16px;
            margin: 10px 5px 10px 0;
            font-size: 16px;
            text-decoration: none;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .edit-button {
            background-color: #4CAF50;
            color: white;
        }

        .edit-button:hover {
            background-color: #45a049;
        }

        .delete-button {
            background-color: #f44336;
            color: white;
        }

        .delete-button:hover {
            background-color: #d32f2f;
        }

        a.button {
            text-align: center;
        }
    </style>
</head>
<body>

<h1>{{ book[1] }}</h1>
<p><strong>Author:</strong> {{ book[2] }}</p>
<p><strong>Year:</strong> {{ book[3] }}</p>
<p><strong>Description:</strong> {{ book[4] }}</p>

<!-- Edit button -->
<a href="{{ url_for('edit_book', book_id=book[0]) }}" class="button edit-button">✏️ Edit</a>

<!-- Delete book form -->
<form method="POST" action="{{ url_for('delete_book', book_id=book[0]) }}" onsubmit="return confirm('Are you sure you want to delete this book?');" style="display:inline;">
    <button type="submit" class="button delete-button">🗑️ Delete</button>
</form>

<!-- Back to list link -->
<p><a href="{{ url_for('books_list') }}">← Back to book list</a></p>

</body>
</html>
