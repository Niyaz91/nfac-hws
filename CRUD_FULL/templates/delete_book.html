<!DOCTYPE html>
<html>
<head>
    <title>Delete Book</title>
</head>
<body>
    <h1>Are you sure you want to delete "{{ book.title }}"?</h1>
    <form method="POST">
        <button type="submit">Yes, Delete</button>
    </form>
    <a href="{{ url_for('book_detail', book_id=book.id) }}">Cancel</a>
</body>
</html>
